# Deploys public_html/ to Spaceship (cPanel/LiteSpeed) over SSH with rsync.
# Manual only. Staging by default; production needs confirm = "production".
# Secrets: SPACESHIP_SSH_KEY (private key), SPACESHIP_HOST, SPACESHIP_USER, SPACESHIP_PORT.
#   TARGET  /home/<user>/staging/      (staging.casaninaflamingo.com docroot)
#           /home/<user>/public_html/  (production)
# rsync --delete removes whatever is on the host and not in the repo; run with
# dry_run = true first and read the deletion list. The excludes keep Vercel-only
# files off the host and leave cPanel's own directories alone.
name: deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: Dry run (rsync -n, nothing changes on the host)
        type: boolean
        default: false
      confirm:
        description: Type "production" to allow a production deploy
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an unconfirmed production deploy
        if: inputs.target == 'production' && inputs.confirm != 'production'
        run: |
          echo '::error::target is production but confirm is not "production"; nothing deployed'
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the sitemap's lastmod values come from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generated files are current
        run: |
          node scripts/build-sitemap.mjs --check
          [ -f scripts/build-schema.mjs ] && node scripts/build-schema.mjs --check
          [ -f scripts/check-robots.py ] && python3 scripts/check-robots.py
          true
      - name: Standing greps
        run: |
          if grep -ril karina public_html; then echo '::error::the host name appears in public_html'; exit 1; fi
          if grep -rl "_vercel/image" public_html; then echo '::error::_vercel/image reference in public_html'; exit 1; fi
          echo "greps clean"

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan
        id: plan
        env:
          USER: ${{ secrets.SPACESHIP_USER }}
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            echo "target_dir=/home/$USER/public_html/" >> "$GITHUB_OUTPUT"
          else
            echo "target_dir=/home/$USER/staging/" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "args=-rlgoDzvcn --delete --delay-updates" >> "$GITHUB_OUTPUT"
          else
            echo "args=-rlgoDzvc --delete --delay-updates" >> "$GITHUB_OUTPUT"
          fi
          # Staging only, real runs only: restore the Directory Privacy lines the
          # deploy just overwrote. Production never runs this.
          if [ "${{ inputs.target }}" = "staging" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            {
              echo 'script_after<<__EOS__'
              echo "AUTH=/home/$USER/staging-auth.htaccess; HT=/home/$USER/staging/.htaccess;"
              echo 'if [ -f "$AUTH" ]; then cat "$AUTH" "$HT" > "$HT.new" && mv "$HT.new" "$HT" && echo "staging auth restored"; else echo "no staging-auth.htaccess; nothing prepended"; fi'
              echo '__EOS__'
            } >> "$GITHUB_OUTPUT"
          else
            echo "script_after=" >> "$GITHUB_OUTPUT"
          fi
          echo "deploying ${{ inputs.target }} (dry_run=${{ inputs.dry_run }})"
      - name: rsync public_html to ${{ inputs.target }}
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SPACESHIP_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SPACESHIP_HOST }}
          REMOTE_USER: ${{ secrets.SPACESHIP_USER }}
          REMOTE_PORT: ${{ secrets.SPACESHIP_PORT }}
          SOURCE: public_html/
          TARGET: ${{ steps.plan.outputs.target_dir }}
          ARGS: ${{ steps.plan.outputs.args }}
          EXCLUDE: /api/, /vercel.json, /.vercelignore, /.well-known/, /cgi-bin/
          SCRIPT_AFTER: ${{ steps.plan.outputs.script_after }}
